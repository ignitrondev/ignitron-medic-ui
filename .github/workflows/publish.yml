name: Release

# Keep this file named `publish.yml`: the npm trusted publisher is registered for it.

on:
  push:
    branches: [main]
    # Manual fallback: tags are scoped to the odontogram package.
    tags: ["odontogram-v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # Tag push (manual fallback): publish the version the tag names.
      - name: Verify odontogram release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./packages/odontogram/package.json').version")"
          EXPECTED_TAG="odontogram-v${PACKAGE_VERSION}"

          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Expected tag ${EXPECTED_TAG}, received ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          # Only release commits that are already on main.
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on main" >&2
            exit 1
          fi

      - name: Publish from tag
        if: github.ref_type == 'tag'
        run: bash scripts/publish-odontogram.sh

      # Branch push. With pending changesets: opens/updates the "Version Packages" PR.
      # With none (the PR was just merged): runs the publish script.
      - name: Version PR or publish
        if: github.ref_type == 'branch'
        # v2 requires @changesets/cli v3; the two must be upgraded together.
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: bash scripts/publish-odontogram.sh
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          create-github-releases: false
          # The publish script pushes the odontogram-v<version> tag itself.
          push-git-tags: false
